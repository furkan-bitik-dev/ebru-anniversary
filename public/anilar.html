  <!-- Lightbox (hidden until a photo is clicked) -->
  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="Fotoğraf görüntüleyici">
    <button class="lightbox-close" id="lb-close" aria-label="Kapat">×</button>
    <button class="lightbox-prev"  id="lb-prev"  aria-label="Önceki">‹</button>
    <img id="lb-img" src="" alt="" />
    <button class="lightbox-next"  id="lb-next"  aria-label="Sonraki">›</button>
  </div>

  <footer class="section footer" style="min-height:auto; padding: 3rem 1.5rem;">
    <div class="footer-inner">
      <p class="footer-line">— Bir ay, bir ömür gibi —</p>
      <p class="footer-tiny">F &amp; E</p>
    </div>
  </footer>

  <script>
    // Lightweight lightbox just for this page
    (function () {
      const tiles = Array.from(document.querySelectorAll('#all-photos .tile img'));
      const lb    = document.getElementById('lightbox');
      const lbImg = document.getElementById('lb-img');
      const close = document.getElementById('lb-close');
      const prev  = document.getElementById('lb-prev');
      const next  = document.getElementById('lb-next');
      let index = 0;

      function show(i) {
        index = (i + tiles.length) % tiles.length;
        const img = tiles[index];
        const src = img.getAttribute('data-full') || img.getAttribute('src');
        const alt = img.getAttribute('alt') || '';
        lbImg.src = src;
        lbImg.alt = alt;
        lb.classList.add('is-open');
        lb.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
      }
      function hide() {
        lb.classList.remove('is-open');
        lb.setAttribute('aria-hidden', 'true');
        lbImg.src = '';
        document.body.style.overflow = '';
      }

      tiles.forEach((img, i) => {
        img.addEventListener('click', () => show(i));
        img.style.cursor = 'zoom-in';
      });

      close.addEventListener('click', hide);
      prev.addEventListener('click', () => show(index - 1));
      next.addEventListener('click', () => show(index + 1));
      lb.addEventListener('click', (e) => { if (e.target === lb) hide(); });

      document.addEventListener('keydown', (e) => {
        if (!lb.classList.contains('is-open')) return;
        if (e.key === 'Escape')    hide();
        if (e.key === 'ArrowLeft') show(index - 1);
        if (e.key === 'ArrowRight')show(index + 1);
      });

      // Graceful fallback if a photo is missing — keep tile but dim it
      tiles.forEach((img) => {
        img.addEventListener('error', () => {
          img.style.display = 'none';
          const tile = img.closest('.tile');
          if (!tile) return;
          tile.style.background = 'radial-gradient(ellipse at center, #6b1f33, #2a0a12)';
          tile.style.cursor = 'default';
          tile.removeEventListener && tile.removeEventListener('click', () => {});
        });
      });

      /* ================================================================
         PASSWORD GATE & DENSE HEART RAIN FOR ANILAR
         ================================================================ */
      function generateHeartRain() {
        const container = document.getElementById("heart-rain");
        if (!container) return;

        const COLORS = [
          "rgba(201, 138, 152, 0.22)",  // dusty rose
          "rgba(232, 197, 204, 0.26)",  // pale rose
          "rgba(139, 26, 58, 0.24)",    // deep rose
          "rgba(212, 168, 83, 0.20)"    // soft gold
        ];

        const COUNT = 60; // Dense rain count
        const rand = (min, max) => Math.random() * (max - min) + min;

        const frag = document.createDocumentFragment();
        for (let i = 0; i < COUNT; i++) {
          const span = document.createElement("span");
          span.className = "rain-heart";
          span.innerHTML = "&#9829;"; // ♥

          const left = rand(0, 98);
          const fontSize = rand(0.8, 2.2).toFixed(2);
          const color = COLORS[Math.floor(Math.random() * COLORS.length)];
          const duration = rand(8, 18).toFixed(2);
          const delay = (-rand(0, 15)).toFixed(2);
          const peakOpacity = rand(0.12, 0.28).toFixed(2);
          const drift = rand(-35, 35).toFixed(0);
          const rotation = rand(180, 540).toFixed(0);

          span.style.left = left + "%";
          span.style.fontSize = fontSize + "rem";
          span.style.color = color;
          span.style.animationDuration = duration + "s";
          span.style.animationDelay = delay + "s";
          span.style.setProperty("--heart-opacity", peakOpacity);
          span.style.setProperty("--drift", drift + "px");
          span.style.setProperty("--rotation", rotation + "deg");

          frag.appendChild(span);
        }
        container.appendChild(frag);
      }

      // Handle password entry
      const gate = document.getElementById("password-gate");
      const form = document.getElementById("password-form");
      const input = document.getElementById("site-password");
      const error = document.getElementById("password-error");
      const box = document.getElementById("password-box");

      if (form) {
        // If already logged in, we immediately hide the gate and clear class lock
        if (sessionStorage.getItem("ebru_auth") === "true") {
          if (gate) {
            gate.style.display = "none";
          }
          document.body.classList.remove("is-locked");
        }

        form.addEventListener("submit", function (e) {
          e.preventDefault();

          // ==========================================
          // EDIT: PASSWORD CONFIGURATION
          // Change 'ebru' below to change your password
          // ==========================================
          const CORRECT_PASSWORD = "2304eeff";

          if (input.value.trim().toLowerCase() === CORRECT_PASSWORD.toLowerCase()) {
            sessionStorage.setItem("ebru_auth", "true");
            gate.classList.add("fade-out");
            document.body.classList.remove("is-locked");
            
            // Remove gate from DOM after transition completes to save resources
            setTimeout(() => {
              if (gate && gate.parentNode) {
                gate.parentNode.removeChild(gate);
              }
            }, 600);
          } else {
            error.textContent = "Hatalı şifre, sevgilim. Tekrar dener misin? ❤️";
            error.classList.add("show");
            box.classList.add("shake");
            input.value = "";
            input.focus();

            // Remove shake class after animation ends
            setTimeout(() => {
              box.classList.remove("shake");
            }, 500);
          }
        });
      }

      // Initialize features
      generateHeartRain();

      // Menü sayacı — 23 Nisan 2026'dan bugüne (script.js ile aynı hesap)
      (function () {
        var el = document.getElementById("site-counter");
        var out = el && el.querySelector(".site-counter-value");
        if (!out) return;
        var BASLANGIC = new Date(2026, 3, 23, 0, 0, 0);
        function guncelle() {
          var t = Math.max(0, new Date() - BASLANGIC);
          var gun = Math.floor(t / 86400000), saat = Math.floor((t % 86400000) / 3600000);
          out.textContent = gun + " gün " + saat + " saat";
          el.setAttribute("title", "Birlikte geçen toplam süre: " + gun + " gün " + saat + " saat");
          el.hidden = false;
        }
        guncelle();
        setInterval(guncelle, 60000);
      })();
    })();
  </script>
